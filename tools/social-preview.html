<!doctype html>
<!--
  仓库的社交预览图源文件（1280×640）。
  重新生成：make social   （需要 playwright-cli，见 docs/RELEASE.md）
  产物：docs/assets/social-preview.png

  为什么用 HTML 而不是画画：字体、间距、渐变都能和界面共用同一套设计令牌，
  改版时不会出现"界面换了，宣传图还是旧的配色"。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0c11; --surface: #12151d; --surface-2: #171b25; --line: #242a36;
    --text: #eef1f6; --dim: #8b93a3; --faint: #5c6474; --brand: #3ddc97;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 460px at 22% 6%, rgba(61,220,151,.13), transparent 60%),
      radial-gradient(700px 420px at 96% 100%, rgba(61,220,151,.06), transparent 62%),
      var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, "PingFang SC", "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 1fr 452px;
    padding: 58px 64px; gap: 44px; align-items: center;
  }

  /* ── 左栏：品牌与主张 ───────────────────────────────── */
  .mark { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
  .glyph {
    width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center;
    background: linear-gradient(160deg, rgba(61,220,151,.26), rgba(61,220,151,.06));
    border: 1px solid rgba(61,220,151,.3);
    box-shadow: 0 14px 40px -16px rgba(61,220,151,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .glyph svg { width: 32px; height: 32px; stroke: var(--brand); fill: none;
               stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wordmark { font-size: 30px; font-weight: 680; letter-spacing: -.02em; line-height: 1.1; }
  .wordmark small { display: block; font-size: 12.5px; font-weight: 500;
                    color: var(--faint); letter-spacing: .12em; margin-top: 5px; }

  h1 { font-size: 47px; font-weight: 700; letter-spacing: -.035em; line-height: 1.2; }
  h1 em { font-style: normal; color: var(--brand); }
  .sub { margin-top: 20px; font-size: 17.5px; color: var(--dim); line-height: 1.75; }
  .sub code {
    font: 15px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 2px 7px; border-radius: 7px; color: #cfe9dd;
  }
  .stats { display: flex; gap: 34px; margin-top: 42px; }
  .stat .v { font: 25px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
             font-weight: 600; color: var(--brand); letter-spacing: -.02em; }
  .stat .k { font-size: 12.5px; color: var(--faint); margin-top: 9px; letter-spacing: .04em; }

  /* ── 右栏：产品主视觉（复刻界面里的状态光环）────────── */
  .panel {
    background: linear-gradient(180deg, rgba(255,255,255,.028), transparent 42%), var(--surface);
    border: 1px solid var(--line); border-radius: 24px; padding: 34px 32px 30px;
    box-shadow: 0 40px 90px -50px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.045);
  }
  .ring { width: 168px; height: 168px; margin: 0 auto 22px; position: relative;
          display: grid; place-items: center; }
  .ring .halo { position: absolute; inset: 0; border-radius: 50%;
                box-shadow: 0 0 70px 10px rgba(61,220,151,.3); }
  .ring svg { width: 132px; height: 132px; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: #1d2431; stroke-width: 3; }
  .ring .arc { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linecap: round;
               stroke-dasharray: 377; stroke-dashoffset: 34; }
  .ring .face { position: absolute; display: grid; place-items: center; }
  .ring .face svg { width: 54px; height: 54px; transform: none; stroke: var(--brand);
                    fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .state { text-align: center; font-size: 25px; font-weight: 660;
           letter-spacing: -.015em; color: var(--brand); }
  .state .ip { display: block; font: 14px ui-monospace, Menlo, monospace;
               font-weight: 500; color: var(--dim); letter-spacing: 0; margin-top: 9px; }
  .rows { margin-top: 26px; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center;
         font-size: 13.5px; padding: 12px 2px; border-bottom: 1px solid rgba(36,42,54,.6); }
  .row span:first-child { color: var(--faint); }
  .row span:last-child { color: #c9d2e0; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .row .ok { color: var(--brand) !important; }
</style>
</head>
<body>

  <div>
    <div class="mark">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/>
        <path d="M9.2 12.2l2 2 3.6-4"/></svg>
      </div>
      <div class="wordmark">驿 · Yi<small>ONE-COMMAND PRIVATE PROXY</small></div>
    </div>

    <h1>一年几十块，<br>跑起<em>属于自己的代理</em>。</h1>

    <p class="sub">
      一条命令买下阿里云香港<strong>竞价实例</strong>，自动装好 VLESS + REALITY ——<br>
      机器被回收就自动重建，<strong>客户端配置不用改</strong>。
    </p>

    <div class="stats">
      <div class="stat"><div class="v">不到 1 MB</div><div class="k">macOS 应用</div></div>
      <div class="stat"><div class="v">0</div><div class="k">运行时第三方依赖</div></div>
      <div class="stat"><div class="v">~2 min</div><div class="k">回收后自愈</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="ring">
      <div class="halo"></div>
      <svg viewBox="0 0 132 132">
        <circle class="track" cx="66" cy="66" r="60"/>
        <circle class="arc"   cx="66" cy="66" r="60"/>
      </svg>
      <div class="face">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/>
        <path d="M9.2 12.2l2 2 3.6-4"/></svg>
      </div>
    </div>
    <div class="state">已连接 <span class="ip">47.52.1.2 · www.cloudflare.com</span></div>
    <div class="rows">
      <div class="row"><span>内核</span><span class="ok">运行中 · pid 4242</span></div>
      <div class="row"><span>系统代理</span><span class="ok">已开启</span></div>
      <div class="row"><span>自动重建 / 状态自愈</span><span class="ok">已开启</span></div>
      <div class="row"><span>本地端口</span><span>7897</span></div>
    </div>
  </div>

</body>
</html>
