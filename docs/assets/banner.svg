  <rect x="304" y="262" width="4" height="20" rx="2" fill="#3ddc97"/>
  <text x="322" y="278" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#3ddc97">
    ./yi up &amp;&amp; ./yi connect
  </text>
